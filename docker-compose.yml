services:
  atlas:
    build: .
    ports:
      - "8080:8080"
    environment:
      ATLAS_JWT_SECRET: ${ATLAS_JWT_SECRET:?set ATLAS_JWT_SECRET}
      ATLAS_LOCAL_PASSWORD: ${ATLAS_LOCAL_PASSWORD:?set ATLAS_LOCAL_PASSWORD}
      ATLAS_DB: /data/atlas.db
    volumes:
      - atlas-data:/data
volumes:
  atlas-data:
